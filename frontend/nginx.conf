map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

# ============================================================
# Block truy cập trực tiếp bằng IP
# ============================================================
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# ============================================================
# Redirect HTTP -> HTTPS
# ============================================================
server {
    listen 80;
    server_name datprojects.click www.datprojects.click;
    return 301 https://datprojects.click$request_uri;
}

# ============================================================
# Redirect www -> non-www
# ============================================================
server {
    listen 443 ssl;
    server_name www.datprojects.click;
    ssl_certificate /etc/letsencrypt/live/datprojects.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datprojects.click/privkey.pem;
    return 301 https://datprojects.click$request_uri;
}

# ============================================================
# Main HTTPS server
# ============================================================
server {
    listen 443 ssl;
    server_name datprojects.click;
    root /usr/share/nginx/html;
    index index.html;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/datprojects.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datprojects.click/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Gzip compression (kept off to avoid ERR_CONTENT_DECODING_FAILED on SockJS EventSource)
    gzip off;

    # Angular SPA: fallback mọi route về index.html
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls ve Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (STOMP / SockJS)
    location ^~ /ws-chat {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Sec-WebSocket-Extensions "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Sec-WebSocket-Extensions "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy uploads/images tu backend (^~ de uu tien hon regex cache ben duoi)
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ============================================================
# Subdomain: curtain.datprojects.click (Laravel PHP App)
# ============================================================
server {
    listen 80;
    listen 443 ssl;
    server_name curtain.datprojects.click;

    ssl_certificate /etc/letsencrypt/live/datprojects.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datprojects.click/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://curtain_laravel:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
