# ============================================================
# Block truy cập trực tiếp bằng IP
# ============================================================
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# ============================================================
# Redirect HTTP -> HTTPS
# ============================================================
server {
    listen 80;
    server_name datprojects.click www.datprojects.click;
    return 301 https://datprojects.click$request_uri;
}

# ============================================================
# Redirect www -> non-www
# ============================================================
server {
    listen 443 ssl;
    server_name www.datprojects.click;
    ssl_certificate /etc/letsencrypt/live/datprojects.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datprojects.click/privkey.pem;
    return 301 https://datprojects.click$request_uri;
}

# ============================================================
# Main HTTPS server
# ============================================================
server {
    listen 443 ssl;
    server_name datprojects.click;
    root /usr/share/nginx/html;
    index index.html;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/datprojects.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/datprojects.click/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Angular SPA: fallback mọi route về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls ve Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (STOMP)
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Proxy uploads/images tu backend (^~ de uu tien hon regex cache ben duoi)
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
