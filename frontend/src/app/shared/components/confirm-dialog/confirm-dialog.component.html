@if (isOpen()) {
  <div
    class="modal-backdrop"
    (mousedown)="onBackdropMouseDown($event)"
    (mouseup)="onBackdropMouseUp($event)"
  >
    <div class="confirm-dialog" (click)="$event.stopPropagation()" role="alertdialog" aria-modal="true">
      <!-- Icon Wrapper -->
      <div
        class="confirm-icon-wrap"
        [class.confirm-icon-wrap--danger]="variant() === 'danger'"
        [class.confirm-icon-wrap--primary]="variant() === 'primary'"
        [class.confirm-icon-wrap--warning]="variant() === 'warning'"
        [class.confirm-icon-wrap--success]="variant() === 'success'"
      >
        @if (variant() === 'danger') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="dialog-icon icon-danger">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        } @else if (variant() === 'warning') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="dialog-icon icon-warning">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        } @else if (variant() === 'success' || variant() === 'primary') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="dialog-icon icon-success">
            <path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16"/>
            <path d="M3 21v-5h5"/>
          </svg>
        }
      </div>

      <!-- Title & Content -->
      <h4 class="confirm-title">{{ title() }}</h4>
      <div class="confirm-body">
        <p class="confirm-msg" [innerHTML]="message()"></p>
        @if (warningMessage()) {
          <div class="cascade-warning">
            {{ warningMessage() }}
          </div>
        }
      </div>

      <!-- Action Buttons -->
      <div class="confirm-actions">
        <button type="button" class="btn btn-ghost" (click)="onCancel()" [disabled]="loading()">
          {{ cancelText() }}
        </button>
        <button
          type="button"
          class="btn"
          [class.btn-danger]="variant() === 'danger'"
          [class.btn-primary]="variant() === 'primary' || variant() === 'success'"
          [class.btn-warning]="variant() === 'warning'"
          (click)="onConfirm()"
          [disabled]="loading()"
          id="btn-confirm-dialog-action"
        >
          @if (loading()) {
            <span class="btn-spinner"></span>
            {{ loadingText() }}
          } @else {
            {{ confirmText() }}
          }
        </button>
      </div>
    </div>
  </div>
}
